<!DOCTYPE html>
<html>
    <body>
        <h1>
            Cart Quantity
        </h1>

        <button onclick = "console.log('Cart Quantity: ' + quantity)">
            Show Quantity
        </button>

        <button onclick = "quantity += 1">
            Add to cart
        </button>

        <button onclick = "quantity += 2">
            +2
        </button>

        <button onclick = "quantity += 3">
            +3
        </button>

        <button onclick = "quantity = 0">
            Reset cart
        </button>

        <script>
            let quantity = 0
        </script>
    </body>

    <head>
        <title>
            Cart Quantity
        </title>

        <style>
            button
            {
                background-color: brown;
                color: white;
            }
        </style>
    </head>
</html>
