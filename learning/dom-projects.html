<!DOCTYPE html>
<html>
    <head>
        <title>
            DOM Projects
        </title>

        <style>
            body
            {
                font-family: Arial;
            }

            .subscribeButton 
            {
                border: none;
                background-color: black;
                color: white;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 15px;
                padding-right: 15px;
                font-weight: bold;
                border-radius: 50px;
                cursor: pointer;
                margin-bottom: 30px;
            }

            .is-subscribed
            {
                background-color: rgb(240, 240, 240);
                color: black;
            }

            .cost-input
            {
                font-size: 15px;
                padding: 10px;
            }

            .calculate-button
            {
                background-color: green;
                color: white;
                border: none;
                font-size: 15px;
                padding: 12px 15px;
                cursor: pointer;
            }

        </style>
    </head>
    <body>
        <p>
            YouTube Subscribe Button
        </p>

        <button class = "subChange subscribeButton" onclick = "Subscribe()">
            Subscribe
        </button>

        <p>
            Amazon Shipping Calculator
        </p>

        <input placeholder = "Cost of order" class = 'js-cost-input cost-input' onkeydown = "CostKeyDown(event)">
        <button class = "cost calculate-button" onclick = "Calculation()">
            Calculate
        </button>

        <p class = "js-total-cost"></p>

        <script>
            function Subscribe()
            {
                let buttonElement = document.querySelector('.subChange')

                if (buttonElement.innerText == 'Subscribe')
                {
                    buttonElement.innerText = 'Subscribed'
                    buttonElement.classList.add('is-subscribed')
                }

                else
                {
                    buttonElement.innerText = 'Subscribe'
                    buttonElement.classList.remove('is-subscribed')
                }
            }

            function CostKeyDown(event)
            {
                if (event.key == 'Enter')
                {
                    Calculation()
                }
            }
            function Calculation()
            {
                let inputElement = document.querySelector('.js-cost-input')
                let cost = Number(inputElement.value)

                if (cost <= 40)
                {
                    cost += 10
                }

                document.querySelector('.js-total-cost').innerHTML = `$${cost}`
            }
        </script>
    </body>
</html>
